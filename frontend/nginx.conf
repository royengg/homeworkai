map $http_x_forwarded_proto $homeworkai_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream homeworkai_backend {
    server backend:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml;

    # --- Security headers ----------------------------------------------------
    # HSTS — only effective over HTTPS, but `always` ensures it is sent on
    # nginx-terminated TLS too. Bumped to two-year max-age with subdomains.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Tight CSP: scripts only from our origin (no inline, no eval), styles
    # from our origin + inline (Tailwind utilities land as inline styles),
    # images / fonts from self + data:, and no third-party framing.
    # Adjust connect-src to your real API + S3/R2 host in production.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.r2.cloudflarestorage.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # --- Backend proxy -------------------------------------------------------
    # The SPA uses /api/v1 as a relative URL. Keeping the API on the same
    # public origin makes secure HttpOnly cookies work without cross-site
    # cookie exceptions and means Coolify only needs to expose this container.
    location /api/ {
        proxy_pass http://homeworkai_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $homeworkai_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Useful for manual checks while keeping the backend private.
    location = /health {
        proxy_pass http://homeworkai_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $homeworkai_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
    }

    # --- Frontend routing ----------------------------------------------------
    # SPA fallback — must come before the cache rule so index.html is never
    # served with a 1-year immutable cache header.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached (or only briefly), so users always pick
    # up the latest hashed asset references after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.r2.cloudflarestorage.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # Hashed asset filenames — safe to cache forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}
